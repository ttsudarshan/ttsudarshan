name: Update profile card

on:
  schedule:
    - cron: "17 11 * * *"     # daily, ~6am Central
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["config.json", "ascii.txt", "ascii_dark.txt", "card.py"]

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build card
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python card.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/
          git diff --cached --quiet || git commit -m "Update profile card"
          git push
